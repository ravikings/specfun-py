name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    name: Check version matches release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare package version to the release tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c '
          import sys, tomllib
          with open("services/specfun/pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
              print(project["version"])
          ')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match services/specfun/pyproject.toml version '${PKG_VERSION}'"
            exit 1
          fi

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      - name: Install nativegate and regenerate from upstream Fortran
        run: |
          pip install "nativegate[clang,build,test]>=0.1.6"
          ngate generate specfun

      - name: Install the service and verify the golden values
        run: |
          pip install -e "services/specfun[build,test]"
          ngate golden verify specfun
          python -m pytest services/specfun/tests -q

  build:
    name: Build distribution
    needs: [check-version]
    if: "!cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build
      - run: pip install build twine
      - name: Rebuild the wheel from source with nativegate
        run: |
          pip install "nativegate[clang,build,test]>=0.1.6"
          ngate generate specfun
          cd services/specfun && python -m build --sdist --wheel
      - name: Twine check
        run: twine check --strict services/specfun/dist/*
      - name: Install the built wheel and import it
        run: |
          pip install --no-deps services/specfun/dist/specfun-*.whl
          python -c "import specfun; print(specfun.DGAMMA(5.0))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: services/specfun/dist/

  publish:
    name: Publish to PyPI
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, test]
    environment:
      name: pypi
      url: https://pypi.org/project/specfun/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
