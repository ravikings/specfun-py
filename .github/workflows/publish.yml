name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-version:
    name: Check version matches release tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare package version to the release tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c '
          import sys, tomllib
          with open("services/specfun/pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
              print(project["version"])
          ')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '${TAG_VERSION}') does not match services/specfun/pyproject.toml version '${PKG_VERSION}'"
            exit 1
          fi

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      - name: Install nativegate and regenerate from upstream Fortran
        run: |
          pip install "nativegate[clang,build,test]>=0.1.9"
          ngate generate specfun

      - name: Install the service and verify the golden values
        run: |
          pip install -e "services/specfun[build,test]"
          ngate golden verify specfun
          python -m pytest services/specfun/tests -q

  build-manylinux:
    # PyPI rejects linux_x86_64-tagged wheels, so Linux binaries are built in
    # a manylinux image and repaired with auditwheel (v1.0.3's 400 made this
    # explicit). gfortran comes from the image's distro; libgfortran gets
    # vendored into the wheel by auditwheel repair.
    name: Build distribution (manylinux 2-28)
    needs: [check-version]
    if: "!cancelled() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')"
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: Install the toolchain from the image's own repos
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc-gfortran gcc-c++ patchelf findutils diffutils || \
          yum install -y gcc-gfortran gcc-c++ patchelf
      - uses: actions/checkout@v4
      - name: Install nativegate and the build tools
        # manylinux's /opt/python cp312 is the interpreter the wheel must
        # target; it ships without pip, so ensurepip first (not get-pip).
        run: |
          PY=$(command -v python3.12 || command -v python3)
          $PY -m ensurepip --upgrade || true
          $PY -m pip install --upgrade pip
          $PY -m pip install "nativegate[clang,build,test]>=0.1.9" build auditwheel twine
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "$PY" > /tmp/pybin
      - name: Regenerate from upstream Fortran
        shell: bash
        run: |
          PY=$(cat /tmp/pybin)
          export PATH="$(dirname "$PY"):$PATH"
          ngate generate specfun
      - name: Build sdist and wheel
        shell: bash
        run: |
          PY=$(cat /tmp/pybin)
          cd services/specfun
          $PY -m build --sdist
          $PY -m build --wheel
      - name: Vendor the shared libs and retag to manylinux
        shell: bash
        run: |
          PY=$(cat /tmp/pybin)
          cd services/specfun
          $PY -m auditwheel repair --plat manylinux_2_28_x86_64 dist/specfun-*.whl -w dist_repaired/
          rm -f dist/specfun-*.whl
          mv dist_repaired/*.whl dist/
          $PY -m twine check --strict dist/specfun-*
      - name: Install the built wheel and import it
        shell: bash
        run: |
          PY=$(cat /tmp/pybin)
          $PY -m pip install --no-deps --force-reinstall services/specfun/dist/specfun-*.whl
          $PY -c "import specfun; print(specfun.DGAMMA(5.0))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-manylinux
          path: |
            services/specfun/dist/specfun-*.whl
            services/specfun/dist/specfun-*.tar.gz
          if-no-files-found: error

  build-macos:
    # macOS platform tags are accepted as built; no repair pass needed.
    name: Build distribution (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          command -v gfortran >/dev/null 2>&1 || brew install gcc
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja
      - name: Install nativegate and regenerate from upstream Fortran
        run: |
          python -m pip install --upgrade pip
          pip install "nativegate[clang,build,test]>=0.1.9"
          ngate generate specfun
      - name: Install build + twine
        run: pip install build twine
      - name: Build the wheel (macOS arm64)
        run: |
          cd services/specfun && python -m build --wheel
      - name: Twine check
        run: twine check --strict services/specfun/dist/specfun-*
      - name: Install the built wheel and import it
        run: |
          pip install --no-deps --force-reinstall services/specfun/dist/specfun-*.whl
          python -c "import specfun; print(specfun.DGAMMA(5.0))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: services/specfun/dist/specfun-*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: success() && github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [test, build-manylinux, build-macos]
    environment:
      name: pypi
      url: https://pypi.org/project/specfun/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-manylinux
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
