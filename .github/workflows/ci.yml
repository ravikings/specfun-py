name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran cmake ninja-build

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v gfortran >/dev/null 2>&1 || brew install gcc
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Install nativegate and the service
        run: |
          pip install "nativegate[clang,build,test]"
          pip install -e "services/specfun[build,test]"

      # The point of this repository: a rebuild must reproduce the pinned
      # digits of the original 1996 Fortran, or CI fails.
      - name: Verify golden values
        run: ngate golden verify specfun

      - name: Run the generated test suite
        working-directory: services/specfun
        run: python -m pytest -q
